schema_version: 1

context:
  name: standardebooks
  version: "4.0.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/standardebooks-${{ version }}.tar.gz
  sha256: f7840ab42c6643485b3b75c22f9e41942bfd644b950de59aebf33b3f7962a799

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - se = se.main:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools ==83.0.0
  run:
    - python >=${{ python_min }}
    - cairosvg ==2.9.0
    - chardet ==7.4.3
    - cssselect ==1.4.0
    - cssutils ==2.15.0
    - ftfy ==6.3.1
    - gitpython ==3.1.54
    - installed_browsers ==0.1.5
    - lxml ==6.1.1
    - natsort ==8.4.0
    - pillow ==12.3.0
    - psutil ==7.2.2
    - pyphen ==0.17.2
    - oxipng-pybind ==10.1.1.post2
    - regex ==2026.6.28
    - repro-zipfile ==0.4.1
    - requests ==2.34.2
    - rich ==15.0.0
    - roman ==5.2
    - selenium ==4.45.0
    - setuptools ==83.0.0
    - smartypants ==2.0.2
    - tinycss2 ==1.5.1
    - titlecase ==2.4.1
    - unidecode ==1.4.0

tests:
  - python:
      imports:
        - se
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - se --help

about:
  summary: The toolset used to produce Standard Ebooks epub ebooks.
  license: GPL-3.0-or-later
  license_file: LICENSE.md
  description: |
    A collection of tools Standard Ebooks uses to produce its ebooks,
    including basic setup of ebooks, text processing, and build tools.
    Installing this toolset using pipx or conda makes the se command
    line executable available. Its various commands are described below,
    or you can use se help to list them.


  homepage: https://standardebooks.org
  repository: https://github.com/standardebooks/tools/

extra:
  recipe-maintainers:
    - thewchan
